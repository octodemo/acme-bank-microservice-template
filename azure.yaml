# yaml-language-server: $schema=https://aka.ms/azure-dev/azure.yaml.json
name: acme-microservice
metadata:
  template: acme-bank-microservice-template@0.0.1
# Demo default: deploy into the existing Acme Bank resource group so this
# service joins the shared platform (ACR, Container Apps Env, App Insights).
# Override by setting AZURE_RESOURCE_GROUP in the azd env.
resourceGroup: rg-acmebank
infra:
  provider: bicep
services:
  myservice:
    project: ./src/MyService
    language: dotnet
    host: containerapp
    docker:
      path: ./src/MyService/Dockerfile
      context: .
