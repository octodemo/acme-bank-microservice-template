# Triggers on pull requests to main; requires contents: read to restore, build, and test.
name: pr-validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Setup .NET 10
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MyService.slnx
      - name: Build
        run: dotnet build MyService.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test MyService.slnx --configuration Release --no-build
